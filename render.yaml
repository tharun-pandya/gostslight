# Static, read-only, fictional-data demo ONLY.
# No backend, no secrets, no private recordings. Never deploy the API publicly.
services:
  - type: web
    name: ghostlight-demo
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_DEMO_MODE
        value: "true"
      - key: NODE_VERSION
        value: "20"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: microphone=(), camera=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
